[project]
name = "jobagent"
version = "0.1.0"
description = "Resume-to-jobs agentic AI capstone: MCP tools, local + Gemini LLMs, full observability"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "google-genai>=1.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "mcp>=1.2,<2",
    "langgraph>=0.2",
    "numpy>=1.26",
    "streamlit>=1.40",
    "typer>=0.12",
    "rich>=13.7",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
jobagent = "jobagent.cli:app"
jobs-mcp = "jobagent.mcp_servers.jobs_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905", "B904", "B008"]
